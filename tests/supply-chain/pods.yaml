apiVersion: v1
kind: Pod
metadata:
  name: signed-web
  namespace: supply-chain
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-1
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: web
      image: 65.109.75.15:30500/nginx-unprivileged@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Pod
metadata:
  name: unsigned-curl
  namespace: supply-chain
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-1
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: 65.109.75.15:30500/curl:unsigned
      command: ["sleep", "86400"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
