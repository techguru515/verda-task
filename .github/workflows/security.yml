name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Kyverno CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          curl -q -fsSL -H "Accept: application/octet-stream" -H "Authorization: Bearer ${GH_TOKEN}" -o kyverno.tar.gz https://api.github.com/repos/kyverno/kyverno/releases/assets/660820927
          code=$?
          size=$(wc -c < kyverno.tar.gz 2>/dev/null)
          kind=$(file -b kyverno.tar.gz 2>/dev/null)
          if [ "$code" -ne 0 ]; then
            echo "::error::curl exit ${code} size ${size} kind ${kind}"
            exit 1
          fi
          tar -xzf kyverno.tar.gz
          tcode=$?
          if [ "$tcode" -ne 0 ]; then
            echo "::error::tar exit ${tcode} size ${size} kind ${kind}"
            exit 1
          fi
          sudo install -m 0755 kyverno /usr/local/bin/kyverno
      - name: Test admission policies
        run: kyverno test tests/kyverno

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: tests/vulnerable
          severity: CRITICAL
          exit-code: "1"

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          # Cluster scan: zero critical findings.
          - nginxinc/nginx-unprivileged:1.29.8-alpine
          # Cluster scan: CVE-2026-31789 in OpenSSL 3.5.2, fixed in 3.5.6.
          # This job fails until the image is rebuilt. See docs/cve-triage.md.
          - curlimages/curl:8.16.0
    steps:
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
