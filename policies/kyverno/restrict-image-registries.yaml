apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - team-a
                - team-b
      validate:
        failureAction: Enforce
        message: "Image registry is not allow-listed. Allowed prefixes: nginxinc/, docker.io/nginxinc/, curlimages/, docker.io/curlimages/, ghcr.io/."
        pattern:
          spec:
            containers:
              - image: "nginxinc/* | docker.io/nginxinc/* | curlimages/* | docker.io/curlimages/* | ghcr.io/*"
            =(initContainers):
              - image: "nginxinc/* | docker.io/nginxinc/* | curlimages/* | docker.io/curlimages/* | ghcr.io/*"
            =(ephemeralContainers):
              - image: "nginxinc/* | docker.io/nginxinc/* | curlimages/* | docker.io/curlimages/* | ghcr.io/*"
