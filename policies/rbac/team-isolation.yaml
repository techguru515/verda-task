apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-reader
  namespace: team-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-own-workloads
  namespace: team-a
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-reader
  namespace: team-a
subjects:
  - kind: ServiceAccount
    name: app-reader
    namespace: team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-own-workloads
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-reader
  namespace: team-b
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-own-workloads
  namespace: team-b
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-reader
  namespace: team-b
subjects:
  - kind: ServiceAccount
    name: app-reader
    namespace: team-b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-own-workloads
---
apiVersion: v1
kind: Secret
metadata:
  name: team-credential
  namespace: team-b
type: Opaque
stringData:
  owner: team-b
  purpose: isolation-demo
